name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: CI / tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout merge result
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Run portable tests
        shell: bash
        run: |
          set -euo pipefail

          required_tests=(
            scripts/test-ci-workflow.js
            scripts/test-speech-finalization.js
            scripts/test-security-boundaries.js
            scripts/test-audio-session.js
            scripts/test-pr-review-fixes.js
            scripts/test-audio-meter.js
          )

          for test_file in "${required_tests[@]}"; do
            if [[ ! -f "$test_file" ]]; then
              echo "::error file=$test_file::Required CI test is missing"
              exit 1
            fi
            echo "==> node $test_file"
            node "$test_file"
          done

          # These tests are introduced by the stacked feature PRs. Running them
          # when present keeps the gate useful before those PRs are rebased onto
          # this bootstrap commit, while keeping the base branch portable.
          optional_tests=(
            scripts/test-audio-runtime.js
            scripts/test-transcription-context.js
            scripts/test-ui-config.js
            scripts/test-repository-docs.js
          )

          for test_file in "${optional_tests[@]}"; do
            if [[ -f "$test_file" ]]; then
              echo "==> node $test_file"
              node "$test_file"
            fi
          done

          # GPU, latency, benchmark, microphone, and live Whisper tests require
          # local hardware or downloaded model assets and are not hosted PR gates.

  test-gate:
    name: CI / test
    if: ${{ always() }}
    needs:
      - test-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report test matrix result
        shell: bash
        run: |
          if [[ "${{ needs.test-matrix.result }}" != "success" ]]; then
            echo "The portable test matrix did not pass: ${{ needs.test-matrix.result }}"
            exit 1
          fi
          echo "Portable test matrix passed"

  build-matrix:
    name: CI / build (${{ matrix.os }})
    needs:
      - test-gate
    if: ${{ needs.test-gate.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win

    steps:
      - name: Checkout merge result
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg rpm libgtk-3-0 libnotify4 libnss3 libxss1 \
            libxtst6 xauth xvfb libasound2t64 ffmpeg python3 python3-venv python3-pip

      - name: Enable Windows long paths
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Build without publishing or signing
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }} --publish never

  build-gate:
    name: CI / build
    if: ${{ always() }}
    needs:
      - test-gate
      - build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report build matrix result
        shell: bash
        run: |
          if [[ "${{ needs.test-gate.result }}" != "success" || "${{ needs.build-matrix.result }}" != "success" ]]; then
            echo "The CI test/build gates did not pass"
            echo "test=${{ needs.test-gate.result }} build=${{ needs.build-matrix.result }}"
            exit 1
          fi
          echo "Test and build gates passed"
